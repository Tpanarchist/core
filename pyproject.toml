[project]
name = "core-ontology"
version = "0.1.0"
description = "A personal foundational Python library built from an explicit ontology."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
finance = [
    "coinbase-advanced-py>=1.8.4,<2",
    "textual>=8.2,<9",
    "tzdata>=2026.4",
]

[project.scripts]
personal-finance = "personal_finance.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/memory", "src/personal_finance"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/core",
    "src/memory",
    "src/personal_finance",
    "tests",
    "README.md",
    "pyproject.toml",
    "SPECIFICATION.md",
    "LAWS.md",
    "ARCHITECTURE.md",
    "MEMORY_SPECIFICATION.md",
    "MEMORY_LAWS.md",
    "MEMORY_ARCHITECTURE.md",
    "MEMORY_ADVERSARIAL_MATRIX.md",
    "docs/FINANCE_CONSTRUCTION.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
